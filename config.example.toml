[plugin]
config_version = "2.0.0"

[report]
mode = "maichenfeng"
title = "今日模型调用财报"
llm_task = "utils"
use_forward_message = true
nickname = "麦麦" # 转发消息内的昵称；留空自动取机器人昵称(还有点小问题...等我下个版本修)
default_opening = "{date}模型调用财报已生成，以下是今日请求次数、回复量与模型成本汇总。感谢大家的投喂，欢迎继续支持～"
# 在财报末尾附上可用指令清单，方便新人上手与自查
show_commands = true
# 自定义指令清单文本；留空使用内置默认
commands_hint = ""

[permission]
query_admin_only = false
admins = ["***REDACTED***"]

[scheduler]
enabled = true
time = "23:30"
group_ids = []
private_ids = []

[fallback]
xiao_names = ["孙笑川"]
locations = [
    "家里",
    "直播间",
    "工作室",
    "走廊",
]
poems = [
    "今天也是嘴硬的一天。",
    "气冷抖，孙狗什么时候才能站起来？",
    "我永远喜欢孙笑川！",
    "大家都很聪明，就是有点笨。",
]
thanks_list = [
    "孙笑川：114514",
    "抽象带篮：1919810",
    "吃花椒的喵酱：810",
]
opening_template = '''我是{xiao_name}，在{location}向大家汇报今天的运营情况。
{date_text}：模型调用 {total_requests} 次，回复 {total_replies} 条，成本合计 {total_cost} 元。
详细数据见下图。

{date_text}{went_to}'''
thanks_template = '''以上就是今天的财报。

模型账单日积月累，钱包确实有点吃紧，全靠群友们的投喂续命，一块两块不嫌少，都是撑下去的动力～

{ledger_line}{poem}
特别感谢 {thanks_amounts}{thanks_suffix} 的投喂🙏
谢谢大家！'''

[ledger]
enabled = true # 账本功能总开关；关闭后 /记账 /账本 均不可用，财报也不再播报累计账本
admin_only = true # 记账命令是否仅管理员可用；查询（/账本）不受此限制

[billing]
# 计费模式：usage=纯按量(原口径) | subscription=固定月费 | hybrid=订阅模型+其余按量混合
mode = "hybrid"
# 订阅支付币种：usd=美元计费（按续费日汇率折人民币）| cny=人民币计费（不换算汇率）
currency = "usd"
# 每月续费日（扣款日，1-31；大于当月天数时取月末）
renew_day = 14
# 每期续费金额（续费日到下个续费日扣款额，配合 currency 使用）
renew_amount = 10.0
# true=把本期订阅费按周期天数均摊为日均成本；false=整期费用一次展示
share_daily = true
# hybrid 模式生效：模型名包含任一关键词即视为订阅（子串匹配，OpenCodeGo 的模型带 -go 后缀）
subscription_models = ["-go"]
# usd 计费且自动获取汇率失败时使用的兜底 USD→CNY 汇率
exchange_rate = 7.2

[pricing]
# 官方牌价引擎：定期抓取供应商价格页，自行按真实单价计算成本。
# 为什么不用麦麦自带的价格：其 statistics 能力不对外暴露「缓存命中/未命中」拆分，
# 而命中价往往只有未命中价的几十分之一，直接用会导致成本被系统性低估。
enabled = true
# 是否每天自动抓取
# 关闭后只能手动发 /价格刷新；此开关不影响财报计算，财报仍会用已抓到的牌价。
auto_refresh = true
# 每天抓取时刻（HH:MM）
refresh_time = "04:10"
# 解析价格页用的模型任务名；留空用 report.llm_task
llm_task = "utils"
# 「巨变」阈值：任一单价相对现役值的涨跌幅超过该百分比，
# 或者出现新增/消失的价带，就挂起等待管理员确认（/价格确认 应用、/价格否决 丢弃）
change_threshold_percent = 20.0
# 关闭后即使超过阈值也直接自动应用
require_admin_confirm = true
# 某个模型没有牌价或取数失败时，退回该模型在麦麦里的原生 cost，避免财报开天窗
fallback_to_native_cost = true
# 首次生效价格时，用官方牌价重算账本里的历史累计开销（只改 cost，不动投喂记录）
rebuild_ledger = true
# 账本重建起始日（YYYY-MM-DD）；留空自动取账本最早一天
rebuild_from = ""
# 覆盖内置价格源，格式：供应商=页面地址
# 内置：DeepSeek=https://api-docs.deepseek.com/quick_start/pricing
#       SiliconFlow=https://siliconflow.cn/pricing
sources = []
